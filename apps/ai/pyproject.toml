[project]
name = "placement-copilot-ai"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.2",
    "uvicorn[standard]>=0.27.1",
    "anthropic>=0.21.0",
    "langchain>=0.1.17",
    "langgraph>=0.0.27",
    "langchain-anthropic>=0.1.12",
    "langchain-core>=0.1.52",
    "langchain-community>=0.0.31",
    "pydantic>=2.6.1",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "redis>=5.0.1",
    "weaviate-client>=4.4.1",
    "python-dotenv>=1.0.1",
    "sse-starlette>=2.0.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
