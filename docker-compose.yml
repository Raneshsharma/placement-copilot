version: '3.9'
services:
  # --- Infrastructure ---
  postgres:
    image: postgres:16-alpine
    ports: [5432:5432]
    environment:
      POSTGRES_USER: placementcopilot
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: placementcopilot
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U placementcopilot"], interval: 10s, timeout: 5s, retries: 5 }

  redis:
    image: redis:7-alpine
    ports: [6379:6379]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 5 }

  elasticsearch:
    image: elasticsearch:8.12.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: false
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: [9200:9200]
    volumes: [es_data:/usr/share/elasticsearch/data]
    healthcheck: { test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"], interval: 30s, timeout: 10s, retries: 5 }

  weaviate:
    image: semitechnologies/weaviate:1.23.0
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: true
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      ENABLE_MODULES: text2vec-openai
      CLUSTER_HOSTNAME: node_1
    ports: [8080:8080]
    volumes: [weaviate_data:/var/lib/weaviate]
    healthcheck: { test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"], interval: 30s, timeout: 10s, retries: 5 }

  # --- Apps ---
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports: [4000:4000]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://placementcopilot:devpassword@postgres:5432/placementcopilot
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-devsecretchangeinprod}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:-devai_secret}
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ai:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
    ports: [8000:8000]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DATABASE_URL: postgresql://placementcopilot:devpassword@postgres:5432/placementcopilot
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      WEAVIATE_URL: http://weaviate:8080
      LOG_LEVEL: INFO
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports: [3000:3000]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_AI_URL: http://localhost:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      - api

volumes:
  postgres_data:
  es_data:
  weaviate_data:
