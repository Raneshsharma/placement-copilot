# Placement Copilot - Redis Configuration
# Used for: session caching, job queues (BullMQ), rate limiting
# This file is mounted into the Redis container.

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Persistence (AOF for durability)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# TCP keepalive
tcp-keepalive 60

# Timeouts
timeout 0

# Logging
loglevel notice

# Security (for trusted networks only)
# requirepass your-redis-password
