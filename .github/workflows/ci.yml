name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint --workspace=@placementcopilot/web
        continue-on-error: true

      - name: Lint API
        run: npm run lint --workspace=@placementcopilot/api
        continue-on-error: true

      - name: Lint shared
        run: npm run lint --workspace=@placementcopilot/shared
        continue-on-error: true

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Type check web
        run: npx tsc --noEmit --project apps/web/tsconfig.json

      - name: Type check API
        run: npx tsc --noEmit --project apps/api/tsconfig.json

      - name: Type check shared
        run: npx tsc --noEmit --project packages/shared/tsconfig.json

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: placementcopilot
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: placementcopilot_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: [6379:6379]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Setup environment
        run: cp .env.example .env
        env:
          DATABASE_URL: postgresql://placementcopilot:testpassword@localhost:5432/placementcopilot_test

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=@placementcopilot/api

      - name: Run API tests
        run: npm test --workspace=@placementcopilot/api

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: apps/api/coverage
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'apps/ai/requirements.txt'

      - name: Cache pip packages
        run: pip install -r apps/ai/requirements.txt --quiet && python -m py_compile apps/ai/src/main.py

      - name: Install dependencies
        run: npm ci
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}

      - name: Build web
        run: npm run build --workspace=@placementcopilot/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: Build API
        run: npm run build --workspace=@placementcopilot/api

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/placement-copilot-web
          tags: type=sha,prefix=,suffix=

      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (api)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/placement-copilot-api
          tags: type=sha,prefix=,suffix=

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (ai)
        id: meta-ai
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/placement-copilot-ai
          tags: type=sha,prefix=,suffix=

      - name: Build and push AI
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ai
          push: true
          tags: ${{ steps.meta-ai.outputs.tags }}
          labels: ${{ steps.meta-ai.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pr-comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    if: github.event_name == 'pull_request'
    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: api-test-results
          continue-on-error: true

      - name: Generate test summary
        id: summary
        run: |
          if [ -d "coverage" ]; then
            echo "summary<<EOF" >> $GITHUB_OUTPUT
            echo "## CI Results" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "| Job | Status |" >> $GITHUB_OUTPUT
            echo "|------|--------|" >> $GITHUB_OUTPUT
            echo "| Lint | :white_check_mark: |" >> $GITHUB_OUTPUT
            echo "| Type Check | :white_check_mark: |" >> $GITHUB_OUTPUT
            echo "| Test | :white_check_mark: |" >> $GITHUB_OUTPUT
            echo "| Build | :white_check_mark: |" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            if [ -f "coverage/coverage-summary.json" ]; then
              echo "**Test Coverage** available in artifacts." >> $GITHUB_OUTPUT
            fi
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "summary<<EOF" >> $GITHUB_OUTPUT
            echo "## CI Results" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "| Job | Status |" >> $GITHUB_OUTPUT
            echo "|------|--------|" >> $GITHUB_OUTPUT
            echo "| Lint | :white_check_mark: |" >> $GITHUB_OUTPUT
            echo "| Type Check | :white_check_mark: |" >> $GITHUB_OUTPUT
            echo "| Test | :white_check_mark: |" >> $GITHUB_OUTPUT
            echo "| Build | :white_check_mark: |" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes('## CI Results'));
            const body = `
              ## CI Results

              | Job | Status |
              |------|--------|
              | Lint | :white_check_mark: Passed |
              | Type Check | :white_check_mark: Passed |
              | Test | :white_check_mark: Passed |
              | Build | :white_check_mark: Passed |

              :robot: Automated CI run by GitHub Actions
            `;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }